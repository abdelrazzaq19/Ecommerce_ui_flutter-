# Static analysis configuration. Run with `flutter analyze`.
#
# The project targets all six Flutter platforms; the generated platform
# directories are excluded because they are not hand-written Dart.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  # NOTE: `language: strict-casts / strict-raw-types` is enabled in Task 4,
  # together with the null-safe Product model and typed API service. Turning it
  # on before those land only produces errors the model rewrite already fixes.

linter:
  rules:
    - prefer_single_quotes
    - unawaited_futures
    - avoid_print
