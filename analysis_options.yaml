# Static analysis configuration. Run with `flutter analyze`.
#
# The project targets all six Flutter platforms; the generated platform
# directories are excluded because they are not hand-written Dart.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    # Enabled in Task 4 alongside the null-safe Product model: it is the lint
    # that catches dynamic JSON being assigned to typed fields.
    strict-casts: true
    # Enabled in Task 10, once the raw `FutureBuilder(` in cart_page.dart was
    # gone.
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - unawaited_futures
    - avoid_print
