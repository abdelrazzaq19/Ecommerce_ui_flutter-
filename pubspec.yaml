name: ecommerce_app
description: "A multi-platform Flutter e-commerce application backed by the FakeStore API."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management.
  provider: ^6.1.5

  # Networking.
  http: ^1.5.0

  # Local persistence for cart, wishlist, session, settings and orders.
  shared_preferences: ^2.5.0

  # Currency and date formatting.
  intl: ^0.20.0

  # Disk-cached product imagery with placeholder and error builders.
  cached_network_image: ^3.4.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
